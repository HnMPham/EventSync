name: Test EventSync
on: [push, pull_request]
jobs:
  backend-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: eventsync_test
          MYSQL_USER: eventsync
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/eventsync_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
          SPRING_DATASOURCE_USERNAME: eventsync
          SPRING_DATASOURCE_PASSWORD: ci-only-password
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
  frontend-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test

  figma-react-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install React dependencies
        working-directory: figma-source
        run: npm install --no-audit --no-fund
      - name: Build React frontend
        working-directory: figma-source
        run: npm run build
      - name: Validate Linux launchers
        run: bash -n Launch-EventSync.sh Stop-EventSync.sh
