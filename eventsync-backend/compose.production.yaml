# Run with:
# docker compose -f compose.yaml -f compose.production.yaml up -d --build
# DNS must point DOMAIN to this server; ports 80 and 443 must be reachable.
services:
  api:
    # The API's 8080 host binding remains localhost-only (see compose.yaml).
    environment:
      ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}
      FRONTEND_URL: https://${DOMAIN:?Set DOMAIN in .env}
      MS_REDIRECT_URI: https://${DOMAIN:?Set DOMAIN in .env}/api/outlook/callback
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  caddy-data:
  caddy-config:
