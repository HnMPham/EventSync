# Run with compose.yaml + compose.production.yaml + compose.figma.yaml.
# First build the exported Figma Make React project into ./figma-dist.
services:
  caddy:
    volumes:
      - ./Caddyfile.figma:/etc/caddy/Caddyfile:ro
      - ./figma-dist:/srv/figma:ro
  api:
    environment:
      ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}
      FRONTEND_URL: https://${DOMAIN:?Set DOMAIN in .env}
      MS_REDIRECT_URI: https://${DOMAIN:?Set DOMAIN in .env}/api/outlook/callback
